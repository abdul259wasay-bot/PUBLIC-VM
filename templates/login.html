<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VM Dashboard — Login</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0a0e1a;
            font-family: 'Segoe UI', monospace;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            color: #e0e0e0;
        }
        .login-box {
            background: #111827;
            border: 1px solid #1e3a5f;
            border-radius: 12px;
            padding: 48px 40px;
            width: 380px;
            box-shadow: 0 0 40px rgba(0, 120, 255, 0.15);
        }
        .logo {
            text-align: center;
            margin-bottom: 32px;
        }
        .logo .icon {
            font-size: 48px;
            margin-bottom: 12px;
        }
        .logo h1 {
            font-size: 22px;
            color: #4fa3ff;
            letter-spacing: 2px;
            text-transform: uppercase;
        }
        .logo p {
            font-size: 12px;
            color: #6b7280;
            margin-top: 4px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            font-size: 12px;
            color: #6b7280;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 8px;
        }
        input[type="password"] {
            width: 100%;
            padding: 12px 16px;
            background: #1f2937;
            border: 1px solid #374151;
            border-radius: 8px;
            color: #e0e0e0;
            font-size: 16px;
            outline: none;
            transition: border-color 0.2s;
            letter-spacing: 4px;
        }
        input[type="password"]:focus {
            border-color: #4fa3ff;
        }
        button {
            width: 100%;
            padding: 13px;
            background: #1d4ed8;
            border: none;
            border-radius: 8px;
            color: white;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
            letter-spacing: 1px;
            text-transform: uppercase;
        }
        button:hover { background: #2563eb; }
        .error {
            background: #7f1d1d;
            border: 1px solid #991b1b;
            color: #fca5a5;
            padding: 10px 14px;
            border-radius: 6px;
            font-size: 13px;
            margin-bottom: 16px;
            text-align: center;
        }
        .status-bar {
            display: flex;
            align-items: center;
            gap: 6px;
            margin-top: 24px;
            justify-content: center;
            font-size: 12px;
            color: #6b7280;
        }
        .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #10b981;
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }
    </style>
</head>
<body>
    <div class="login-box">
        <div class="logo">
            <div class="icon">🛡️</div>
            <h1>VM Dashboard</h1>
            <p>Security & Monitoring Console</p>
        </div>
        {% if error %}
        <div class="error">⛔ {{ error }}</div>
        {% endif %}
        <form method="POST">
            <div class="form-group">
                <label>Access Key</label>
                <input type="password" name="key" placeholder="Enter access key" autofocus required>
            </div>
            <button type="submit">🔐 Enter Dashboard</button>
        </form>
        <div class="status-bar">
            <div class="dot"></div>
            <span>System Online</span>
        </div>
    </div>
</body>
</html>
